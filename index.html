<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vergleich Bestandsheizung – Nahwärme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --brand: #9DC241;          /* Enerpipe-Grün (aus dem Logo) */
    --brand-dark: #4F7319;     /* dunkles Grün für Texte/Links (Kontrast 5,5:1) */
    --brand-mid: #7FA72E;
    --brand-soft: #EEF5E1;
    --brand-softer: #F6FAEF;
    --bg: #F3F5EF; --surface: #ffffff; --surface-2: #F4F6F1; --line: #E1E5DA;
    --text: #1E2418; --text-2: #55594F; --text-3: #7D8276;
    --accent: #9DC241; --accent-ink: #4F7319; --accent-soft: #EEF5E1; --accent-text: #1B2410;
    --good: #4F7319; --good-soft: #EEF5E1; --warn: #8a5a00; --warn-soft: #fdf3dc;
    /* Diagrammfarben: Nahwärme im Enerpipe-Grün, Vergleichssysteme gedämpft */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #e0a100; --s5: #e87ba4; --s6: #7FA72E; --s7: #4F7319; --s8: #8B5E34; --s9: #C0504D;
    --bar1: #6B9124; --bar2: #C3DC8C;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(30,36,24,.04), 0 6px 24px rgba(30,36,24,.06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 96px; }
  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  header.top .logo { height: 40px; width: auto; display: block; }
  header.top h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 600; }
  header.top .objekt { color: var(--text-2); font-weight: 400; }

  /* Schrittleiste */
  nav.steps { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  nav.steps button { border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  nav.steps button .nr { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center;
    border-radius: 50%; background: var(--surface-2); margin-right: 6px; font-size: 11px; }
  nav.steps button.aktiv { background: var(--accent); color: var(--accent-text); border-color: var(--accent-ink); }
  nav.steps button.aktiv .nr { background: rgba(255,255,255,.25); }
  nav.steps button.fertig .nr { background: var(--good-soft); color: var(--good); }

  section.seite { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
  section.seite h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  section.seite .lead { color: var(--text-2); margin: 0 0 20px; }
  h3 { font-size: 15px; margin: 22px 0 10px; font-weight: 600; }

  /* Formularfelder */
  .felder { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px; }
  .feld label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .feld .hilfe { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .eingabe { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .eingabe:focus-within { border-color: var(--accent-ink); box-shadow: 0 0 0 3px var(--accent-soft); }
  .eingabe input, .eingabe select { flex: 1; min-width: 0; border: 0; padding: 9px 10px; font: inherit; background: transparent; color: var(--text); outline: none; }
  .eingabe input { text-align: right; font-variant-numeric: tabular-nums; }
  .eingabe input.txt { text-align: left; }
  .eingabe .einheit { padding: 9px 10px; color: var(--text-3); background: var(--surface-2); font-size: 13px; white-space: nowrap; display: flex; align-items: center; }
  .eingabe.gross input { font-size: 20px; padding: 10px 12px; }
  input.fehler { color: #c62828; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 8px 16px; font: inherit; cursor: pointer; color: var(--text-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.an { background: var(--accent); color: var(--accent-text); }

  /* Erzeuger-Kacheln */
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .kachel { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 14px; cursor: pointer; background: var(--surface); user-select: none; }
  .kachel:hover { border-color: var(--accent-ink); }
  .kachel.an { border-color: var(--accent-ink); background: var(--accent-soft); }
  .kachel input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent-ink); }
  .kachel .t { font-weight: 600; }
  .kachel .u { font-size: 12px; color: var(--text-3); }

  .ergebniszeile { margin-top: 20px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); display: flex; gap: 24px; flex-wrap: wrap; }
  .ergebniszeile div { font-size: 13px; color: var(--text-2); }
  .ergebniszeile b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }

  details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  details > summary { cursor: pointer; color: var(--accent-ink); font-size: 14px; }
  details[open] > summary { margin-bottom: 12px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  thead th { font-size: 12px; color: var(--text-2); font-weight: 600; vertical-align: bottom; }
  tr.summe td { font-weight: 600; border-top: 2px solid var(--line); }
  tr.highlight td { background: var(--good-soft); }
  .scroll { overflow-x: auto; }
  table.annahmen td { padding: 3px 4px; }
  table.annahmen input { width: 100%; min-width: 86px; border: 1px solid transparent; border-radius: 6px; padding: 6px 6px;
    font: inherit; text-align: right; background: var(--surface-2); color: var(--text); }
  table.annahmen input:hover { border-color: var(--line); }
  table.annahmen input:focus { outline: none; border-color: var(--accent-ink); background: var(--surface); }
  table.annahmen input::placeholder { color: var(--text-3); font-style: italic; }
  table.annahmen td.einh { color: var(--text-3); font-size: 12px; text-align: left; }
  table.annahmen td.fest { padding-right: 12px; color: var(--text-2); }
  table.annahmen .na { color: var(--text-3); font-size: 12px; text-align: center; }

  .hinweis { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); margin: 12px 0; font-size: 14px; }
  .info { font-size: 13px; color: var(--text-3); }
  .berater { display: flex; gap: 12px; align-items: flex-start; margin: 18px 0; padding: 14px 16px; border-radius: 10px;
    background: var(--warn-soft); border: 2px solid var(--warn); color: var(--text); font-size: 14px; }
  .berater b { color: var(--warn); font-size: 16px; }
  .berater.gross b { font-size: 18px; }
  .berater a { color: var(--accent-ink); font-weight: 600; display: inline-block; margin-top: 6px; }
  .berater .ico { flex: 0 0 32px; height: 32px; border-radius: 50%; background: var(--warn); color: var(--surface);
    font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .kfwknopf { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; text-align: left; width: 100%; }
  .kfwknopf b { font-size: 18px; color: var(--good); }
  label.radio { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; font-size: 14px; }
  label.radio input { margin-top: 3px; accent-color: var(--accent-ink); }
  .kfw-summe { margin-top: 14px; }
  .frage { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .frage .seg button { min-width: 64px; font-weight: 600; }
  .seg button.an { background: var(--brand); color: var(--accent-text); }
  .kfw-fragen { margin: 14px 0 8px; }
  .kfw-sonderfall { margin: 6px 0 12px; border-top: 0; padding-top: 0; }
  .bestand-kgb { margin: 6px 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
  .kgb-status { margin-top: 8px; font-size: 14px; }
  .kgb { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-right: 4px; }
  .kgb.ja { background: var(--brand); color: var(--accent-text); }
  .kgb.nein { background: #f3d6d2; color: #9b2c1f; }
  .kgb.offen { background: var(--warn-soft); color: var(--warn); }
  .nwhinweis { margin: 12px 0; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); border-left: 4px solid var(--accent); font-size: 14px; }
  .fibreflex { margin-top: 22px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .fibreflex h3 { margin-top: 0; }
  .fibreflex table { background: var(--surface); }
  ul.vorteile { margin: 6px 0 10px; padding-left: 20px; }
  ul.vorteile li { margin: 4px 0; }
  label.bestaetigen { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-weight: 600; }
  label.bestaetigen input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent-ink); flex-shrink: 0; }
  .menue-liste a.menue-link { display: block; padding: 8px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
  .menue-liste a.menue-link:hover { background: var(--surface-2); }
  .marktpreis .links { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .marktpreis a { color: var(--accent-ink); font-size: 14px; }
  .marke { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); margin-left: 6px; }
  .marke.gut { background: var(--good-soft); color: var(--good); }
  .eingabe select { text-align: left; }
  .marktpreis { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); }

  /* Ergebnis */
  .sieger { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 16px 18px; border-radius: var(--radius); background: var(--good-soft); margin-bottom: 18px; }
  .sieger .gross { font-size: 26px; font-weight: 700; color: var(--good); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .kpi .l { font-size: 12px; color: var(--text-2); }
  .kpi .w { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: 6px 0; }
  .legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
  .legende.linie span::before { height: 3px; width: 14px; vertical-align: 3px; }
  svg text { font-family: inherit; }
  .chart { position: relative; }
  .tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 5; min-width: 180px; }
  .tooltip .z { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .z i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Fußleiste */
  footer.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 10; }
  footer.nav .wrap { padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  button.btn { font: inherit; border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  button.btn:hover { background: var(--surface-2); }
  button.btn.primaer { background: var(--accent); color: var(--accent-text); border-color: var(--accent-ink); font-weight: 600; }
  button.btn.klein { padding: 5px 10px; font-size: 13px; }
  button.btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .kachel:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  u.mn { text-decoration: underline; text-underline-offset: 2px; }
  .spacer { flex: 1; }
  .kbd { font-size: 12px; color: var(--text-3); }
  kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); }

  /* Menü & Dialoge */
  .menue { position: relative; }
  .menue-liste { position: absolute; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14); min-width: 270px; padding: 4px; display: none; z-index: 20; }
  .menue-liste.offen { display: block; }
  .menue-liste button { display: flex; width: 100%; justify-content: space-between; gap: 20px; border: 0; background: none; padding: 8px 10px;
    font: inherit; text-align: left; border-radius: 6px; cursor: pointer; color: var(--text); }
  .menue-liste button:hover, .menue-liste button:focus { background: var(--surface-2); outline: none; }
  .menue-liste hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .dialog-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .dialog-bg.offen { display: flex; }
  .dialog { background: var(--surface); border-radius: 12px; padding: 20px 22px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
  .dialog h3 { margin-top: 0; }
  .dialog textarea { width: 100%; min-height: 180px; font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface-2); color: var(--text); }
  .dialog .knoepfe { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px;
    border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
  .toast.an { opacity: 1; }

  .hist td { padding: 3px 4px; }
  .hist input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; text-align: right; background: var(--surface); color: var(--text); }

  @media (max-width: 640px) {
    section.seite { padding: 16px; }
    .kbd { display: none; }
  }
  @media print {
    footer.nav, nav.steps, .menue, .no-print { display: none !important; }
    body { background: #fff; }
    section.seite { border: 0; padding: 0; }
  }

  /* ======================= Enerpipe-Gestaltung ======================= */
  html, body { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 15px; }
  body { background: linear-gradient(180deg, var(--brand-softer) 0, var(--bg) 320px) no-repeat, var(--bg); }
  h1, h2, h3, .kpi .w, .sieger .gross, .ergebniszeile b { font-family: "Barlow Semi Condensed", Inter, "Segoe UI", sans-serif; }
  header.top { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 20px;
    margin: 4px 0 16px; border-bottom: 4px solid var(--brand); gap: 18px; }
  header.top .logo { height: 52px; width: auto; display: block; }
  header.top .logos { display: flex; align-items: center; gap: 14px; }
  header.top .logo-ulfig { height: 74px; margin: -8px 0; }
  header.top .logotrenner { width: 1px; align-self: stretch; background: var(--border, #ddd); }
  header.top h1 { font-size: 24px; font-weight: 600; color: var(--text); line-height: 1.15; display: flex; flex-direction: column; }
  header.top h1 .objekt { font-family: Inter, sans-serif; font-size: 14px; color: var(--text-2); font-weight: 500; }
  nav.steps { gap: 6px; }
  nav.steps button { border: 0; background: var(--surface); box-shadow: var(--shadow); padding: 7px 14px; font-weight: 500; }
  nav.steps button .nr { background: var(--surface-2); }
  nav.steps button.aktiv { background: var(--brand); color: var(--accent-text); font-weight: 600; }
  nav.steps button.aktiv .nr { background: rgba(255,255,255,.55); }
  nav.steps button.fertig .nr { background: var(--brand-soft); color: var(--brand-dark); }
  section.seite { border: 0; box-shadow: var(--shadow); padding: 28px 30px; }
  section.seite h2 { font-size: 30px; font-weight: 600; letter-spacing: .2px; position: relative; padding-bottom: 8px; margin-bottom: 10px; }
  section.seite h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 48px; height: 4px; border-radius: 2px; background: var(--brand); }
  h3 { font-size: 19px; font-weight: 600; }
  .eingabe { border-radius: 10px; }
  .eingabe:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(157,194,65,.28); }
  .kachel { border-radius: 14px; transition: border-color .15s, background .15s, transform .15s; }
  .kachel:hover { border-color: var(--brand); transform: translateY(-1px); }
  .kachel.an { border-color: var(--brand); background: var(--brand-softer); box-shadow: inset 0 0 0 1px var(--brand); }
  .kachel input, label.radio input, label.bestaetigen input, input[data-staffel] { accent-color: var(--brand-mid); }
  .ergebniszeile { background: var(--brand-softer); border: 1px solid var(--brand-soft); border-radius: 12px; }
  .sieger { background: linear-gradient(135deg, var(--brand-soft), #ffffff); border: 1px solid #DCEBBE; border-left: 6px solid var(--brand); border-radius: 14px; }
  .sieger .gross { color: var(--brand-dark); font-size: 32px; }
  .kpi { border: 0; border-top: 4px solid var(--brand); background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; }
  .kpi .w { font-size: 24px; }
  table thead th { color: var(--text-2); }
  tr.summe td { border-top-color: var(--brand); }
  table.annahmen input { border-radius: 8px; }
  table.annahmen input:focus { border-color: var(--brand); }
  button.btn { border-radius: 10px; font-weight: 500; transition: background .15s, box-shadow .15s; }
  button.btn.primaer { background: var(--brand); border-color: var(--brand); color: var(--accent-text); font-weight: 600;
    box-shadow: 0 2px 8px rgba(157,194,65,.35); }
  button.btn.primaer:hover { background: #A9CB52; }
  button.btn.primaer:disabled { box-shadow: none; }
  button:focus-visible, .kachel:focus-within, a:focus-visible { outline: 3px solid var(--brand-mid); outline-offset: 2px; }
  footer.nav { background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
  .marktpreis { background: var(--brand-softer); border-color: var(--brand-soft); border-radius: 12px; }
  .marke.gut { background: var(--brand-soft); color: var(--brand-dark); }
  .kfwknopf b { color: var(--brand-dark); }
  .nwhinweis { background: var(--brand-softer); border-left-color: var(--brand); }
  .fibreflex { background: linear-gradient(135deg, var(--brand-softer), #ffffff); border: 1px solid #DCEBBE; }
  .fibreflex h3 { color: var(--brand-dark); }
  .ff-kopf { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .ff-kopf p { flex: 1 1 260px; margin: 0; }
  .ff-stark { display: flex; gap: 16px; align-items: center; margin: 14px 0 16px; padding: 14px 18px; border-radius: 14px;
    background: var(--surface); border: 2px solid var(--brand); box-shadow: var(--shadow); }
  .ff-stark .ff-icon { flex: 0 0 56px; width: 56px; height: 56px; }
  .ff-stark b { font-family: "Barlow Semi Condensed", Inter, sans-serif; font-size: 21px; color: var(--brand-dark); line-height: 1.2; }
  .ff-stark p { margin: 4px 0 0; }
  @media (max-width: 640px) { .ff-stark { align-items: flex-start; padding: 12px 14px; } .ff-stark .ff-icon { flex-basis: 40px; width: 40px; height: 40px; } .ff-stark b { font-size: 18px; } }
  .ff-bild { flex: 0 1 340px; width: 100%; max-width: 340px; height: auto; border-radius: 12px; background: #fff; }
  @media (max-width: 640px) { .ff-bild { max-width: 100%; flex-basis: 100%; } }
  @media print { .ff-bild { max-width: 240px; } }

 * ========================================================================== */
(function (root) {
  'use strict';

  /** Spalten des Vergleichs in Excel-Reihenfolge (B..H). */
  const VARIANTEN = ['oel', 'gas', 'holz', 'kofen', 'pellets', 'hack', 'wp', 'nw1', 'nw2'];

  const ERBE = {
    oel:     { wg: 'E:oel.wg', einheit: 'E:oel.einheit', heizwert: 'E:oel.heizwert', wartung: 'G:wartung', kk: 'G:kk' },
    gas:     { wg: 'E:gas.wg', einheit: 'E:gas.einheit', heizwert: 'E:gas.heizwert', wartung: 'V:oel', kk: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    holz:    { wg: 'E:holz.wg', einheit: 'E:holz.einheit', heizwert: 'E:holz.heizwert', kk: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    pellets: { wg: 'E:pellets.wg', einheit: 'E:pellets.einheit', heizwert: 'E:pellets.heizwert', kk: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    kofen:   { wg: 'E:kaminH.wg', einheit: 'E:kaminH.einheit', heizwert: 'E:kaminH.heizwert', kk: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    hack:    { wg: 'E:hack.wg', einheit: 'E:hack.einheit', heizwert: 'E:hack.heizwert', kk: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    wp:      { wartung: 'V:oel', zins: 'V:oel', afa: 'V:oel' },
    nw1:     {},
    nw2:     '*nw1' // alle Felder außer Abschreibungszeit wie Nahwärme (1. Spalte)
  };

  /** Felder einer Energieträger-Spalte. */
  const FELDER = ['wg', 'einheit', 'heizwert', 'preis', 'grund', 'wartung', 'kk', 'sonst',
                  'spezInv', 'invManuell', 'foerder', 'zins', 'afa', 'steigerung'];

  const isNum = (x) => typeof x === 'number' && isFinite(x);
  const num = (x) => (isNum(x) ? x : 0);
  const sum = (a) => a.reduce((s, x) => s + num(x), 0);
  const avg = (a) => { const v = a.filter(isNum); return v.length ? sum(v) / v.length : 0; };

  /** Excel PMT (Annuität), als positiver Betrag. */
  function annuitaet(zins, jahre, barwert) {
    if (!jahre) return 0;
    if (zins === 0) return barwert / jahre;
    return (zins * barwert) / (1 - Math.pow(1 + zins, -jahre));
  }

  /** Grunddaten auswerten (Durchschnitt Ölverbrauch, Rechnungen). */
  function grunddaten(gd) {
    const hist = (gd.oelHist || []).map((r) => r.liter).filter(isNum);
    const wartungBrutto = num(gd.wartung && gd.wartung.netto) + num(gd.wartung && gd.wartung.mwst);
    const kkBrutto = (gd.kaminkehrer || [])
      .filter((r) => isNum(r.netto) || isNum(r.mwst))
      .map((r) => num(r.netto) + num(r.mwst));
    return {
      oelSumme: sum(hist),
      oelDurchschnitt: hist.length ? sum(hist) / hist.length : null,
      wartungBrutto,
      kkDurchschnitt: avg(kkBrutto),
      kkBrutto
    };
  }

  /** Anschlusskosten Nahwärme nach Leistungsstaffel (Excel INDEX/COUNTIF "<"). */
  function anschlusskosten(staffel, kw) {
    const s = (staffel || []).filter((r) => isNum(r.bis)).slice().sort((a, b) => a.bis - b.bis);
    const idx = s.filter((r) => r.bis < kw).length;
    return idx < s.length ? { betrag: num(s[idx].preis), ausserhalb: false }
                          : { betrag: 0, ausserhalb: true };
  }

  /** KfW-458-Höchstbetrag förderfähiger Kosten nach Wohneinheiten. */
  function kfwHoechstbetrag(kfw, we) {
    if (!(we > 0)) return 0;
    return num(kfw.we1) + Math.min(Math.max(we - 1, 0), 5) * num(kfw.we2_6) + Math.max(we - 6, 0) * num(kfw.we7);
  }

  /** Eingabe-Spalten inkl. Vererbung auflösen. */
  function aufloesen(s, gdx) {
    const E = {};
    s.erhebung.forEach((z) => { E[z.key] = z; });
    const out = {};
    const herkunft = {}; // für UI: woher stammt ein geerbter Wert
    const quelleWert = (q, feld) => {
      if (q.startsWith('E:')) { const [k, f] = q.slice(2).split('.'); return E[k] ? E[k][f] : null; }
      if (q === 'G:wartung') return gdx.wartungBrutto;
      if (q === 'G:kk') return gdx.kkDurchschnitt;
      if (q.startsWith('V:')) return out[q.slice(2)][feld];
      return null;
    };
    VARIANTEN.forEach((k) => {
      const roh = s.v[k] || {};
      const regel = ERBE[k];
      const r = {}; herkunft[k] = {};
      FELDER.forEach((f) => {
        let w = roh[f];
        if (w === null || w === undefined || w === '') {
          if (regel === '*nw1') { w = f === 'afa' ? null : out.nw1[f]; herkunft[k][f] = 'nw1'; }
          else if (regel[f]) { w = quelleWert(regel[f], f); herkunft[k][f] = regel[f]; }
          else w = null;
        }
        r[f] = (w === undefined) ? null : w;
      });
      out[k] = r;
    });
    return { spalten: out, herkunft };
  }

  /** Hauptberechnung. Liefert alle Zwischen- und Endwerte wie das Excel-Blatt. */
  function berechne(s) {
    const gdx = grunddaten(s.gd || {});
    const warnungen = [];

    // --- 1. Erhebungsbogen ---------------------------------------------------
    const erhebung = s.erhebung.map((z) => {
      let menge = z.menge;
      let mengeAusHist = false;
      if (z.aktiv === false) menge = null;
      else if (menge === null || menge === undefined) {
        // leere Menge: Mittelwert der eingegebenen Verbrauchsjahre (Excel: Grunddaten!B14)
        const eigeneHist = (z.hist || []).map((r) => r.menge).filter(isNum);
        if (eigeneHist.length) { menge = avg(eigeneHist); mengeAusHist = true; }
        else if (z.key === 'oel' && gdx.oelDurchschnitt !== null) { menge = gdx.oelDurchschnitt; mengeAusHist = true; }
      }
      const endenergie = num(menge) * num(z.heizwert);
      return Object.assign({}, z, { mengeEff: isNum(menge) ? menge : null, mengeAusHist,
                                    endenergie, nutzwaerme: endenergie * num(z.wg) });
    });
    const leistungBestand = sum(erhebung.filter((z) => z.aktiv !== false).map((z) => z.kw));
    const endenergieSumme = sum(erhebung.map((z) => z.endenergie));
    const nutzwaermeGesamt = sum(erhebung.map((z) => z.nutzwaerme));
    // Scheitholz/Kaminofen, die zusätzlich in Betrieb bleiben: deren Wärme muss die neue Anlage nicht liefern
    // Kaminofen = Zusatzheizung: bleibt er in Betrieb, gilt ohne eigene Angabe der gesamte bisherige Verbrauch als weiter verheizt
    const sterWeiter = (z) => (z.key === 'kamin' && !isNum(z.weiter) ? num(z.mengeEff) : num(z.weiter));
    const holzWeiterListe = erhebung.filter((z) => z.aktiv !== false && z.bleibt === true && (z.key === 'holz' || z.key === 'kamin') && sterWeiter(z) > 0)
      .map((z) => ({ key: z.key, ster: sterWeiter(z), waerme: sterWeiter(z) * num(z.heizwert) * num(z.wg) }));
    const holzWeiter = Math.min(nutzwaermeGesamt, sum(holzWeiterListe.map((h) => h.waerme)));
    const holzWeiterSter = sum(holzWeiterListe.map((h) => h.ster));
    const nutzwaerme = nutzwaermeGesamt - holzWeiter;
    // Leitung/Anlage wird für den vollen Bedarf ausgelegt (auch an Tagen ohne Holzfeuer) –
    // ausgenommen eine weiter betriebene Zusatzheizung (Kaminofen): deren Wärme ersetzt die Nahwärme nicht
    const nebenWeiter = Math.min(holzWeiter, sum(holzWeiterListe.filter((h) => h.key === 'kamin').map((h) => h.waerme)));
    const auslegungsbedarf = nutzwaermeGesamt - nebenWeiter;
    const heizleistung = s.vollast > 0 ? auslegungsbedarf / s.vollast : 0;
    const mindestabnahme = nutzwaerme * num(s.mindestPct);
    const hoechstbetrag = kfwHoechstbetrag(s.gd.kfw || {}, s.we);
    const anschluss = anschlusskosten(s.gd.staffel, heizleistung);
    // Nahwärme-Anschlusskosten: fester Betrag (Angebot) oder – nur wenn ausdrücklich gewählt – nach Staffel
    const nwStaffel = s.nwStaffel === true;
    const nwFest = s.v.nw1 && isNum(s.v.nw1.invManuell);
    if (nwStaffel && !nwFest && anschluss.ausserhalb) {
      warnungen.push('Leistung über der Staffel (' + (Math.floor(heizleistung * 10 + 1e-9) / 10).toFixed(1).replace('.', ',') +
        ' kW): Anschlusskosten Nahwärme individuell – bitte Betrag aus dem Angebot eintragen.');
    }

    // --- 2./3./4. Varianten --------------------------------------------------
    const { spalten, herkunft } = aufloesen(s, gdx);
    const ergebnisse = {};
    VARIANTEN.forEach((k) => {
      const v = spalten[k];
      const istNW = k === 'nw1' || k === 'nw2';
      const wg = num(v.wg), hw = num(v.heizwert);
      const endenergie = wg > 0 ? nutzwaerme / wg : NaN;
      const menge = hw > 0 ? endenergie / hw : NaN;
      const invBerechnet = istNW ? (nwStaffel ? anschluss.betrag : NaN) : heizleistung * num(v.spezInv);
      const invAngesetzt = isNum(v.invManuell) ? v.invManuell : invBerechnet;
      // Nahwärme wird nur bewertet, wenn Wärmepreis und Anschlusskosten eingegeben sind
      const fehlt = [];
      if (istNW && !isNum(v.preis)) fehlt.push('Arbeitspreis');
      if (istNW && !isFinite(invAngesetzt)) fehlt.push('Anschlusskosten');
      const foerderfaehig = s.we > 0 ? Math.min(invAngesetzt, hoechstbetrag) : invAngesetzt;
      const foerderung = foerderfaehig * num(v.foerder);
      const invNetto = invAngesetzt - foerderung;
      const kapital = annuitaet(num(v.zins), num(v.afa), invNetto);
      const energie = menge * num(v.preis);
      const grund = num(v.grund) * 12;
      const nebenkosten = num(v.wartung) + num(v.kk) + num(v.sonst);
      const laufend = energie + grund + nebenkosten;
      const gesamt = kapital + laufend;
      const ok = nutzwaerme > 0 && fehlt.length === 0;
      const ctLaufend = ok ? laufend / nutzwaerme * 100 : NaN;
      const ctKapital = ok ? kapital / nutzwaerme * 100 : NaN;
      ergebnisse[k] = {
        name: k === 'nw1' || k === 'nw2' ? 'Nahwärme (' + num(v.afa) + ' J. Afa)'
          : (k === 'gas' && ((s.erhebung || []).find((z) => z.key === 'gas') || {}).art === 'fluessig' ? 'Flüssiggas' : NAMEN[k]),
        eingabe: v, nutzwaerme, leistung: heizleistung, endenergie, menge,
        invBerechnet, invAngesetzt, foerderfaehig, foerderung, invNetto, kapital,
        energie, grund, nebenkosten, laufend, gesamt: fehlt.length ? NaN : gesamt, fehlt,
        ctLaufend, ctKapital, ctEffektiv: ctLaufend + ctKapital
      };
    });

    // Rang (Excel RANK aufsteigend, Gleichstände gleicher Rang) und Vergleich zu Nahwärme
    const aus = s.ausblenden || [];
    VARIANTEN.forEach((k) => { ergebnisse[k].ausgeblendet = aus.includes(k); });
    const eff = VARIANTEN.filter((k) => !aus.includes(k)).map((k) => ergebnisse[k].ctEffektiv);
    let minK = null;
    VARIANTEN.forEach((k) => {
      const e = ergebnisse[k];
      e.rang = isFinite(e.ctEffektiv) && !e.ausgeblendet ? 1 + eff.filter((x) => isFinite(x) && x < e.ctEffektiv).length : null;
      e.deltaNW = e.gesamt - ergebnisse.nw1.gesamt;
      if (e.fehlt.length) e.deltaNW = NaN;
      if (!e.ausgeblendet && !(s.nichtSieger || []).includes(k) && isFinite(e.ctEffektiv) && (minK === null || e.ctEffektiv < ergebnisse[minK].ctEffektiv)) minK = k;
    });

    if (ergebnisse.nw1.fehlt.length && nutzwaerme > 0) {
      warnungen.push('Nahwärme noch nicht bewertet – es fehlen: ' + ergebnisse.nw1.fehlt.join(' und ') + ' (Schritt „Nahwärme“).');
    }

    // --- Verlauf (kumulierte Kosten, Cash-Betrachtung) -----------------------
    const jahre = Math.max(1, Math.round(num(s.verlaufJahre) || 30));
    const verlauf = {};
    VARIANTEN.forEach((k) => {
      const e = ergebnisse[k];
      const g = num(e.eingabe.steigerung);
      if (e.fehlt.length || e.ausgeblendet) { verlauf[k] = null; return; }
      const reihe = [e.invNetto];
      // Ersatzinvestition (optional): nach Ablauf der Abschreibungszeit Neuanschaffung ohne Förderung –
      // Heizungen zum vollen Preis, Nahwärme mit dem Anteil s.ersatzAnteilNW der Anschlusskosten (z. B. 2/3)
      const afa = num(e.eingabe.afa);
      const istNW = k === 'nw1' || k === 'nw2';
      const anteil = istNW ? num(s.ersatzAnteilNW) : 1;
      const ersatz = s.ersatz === true && afa > 0 && anteil > 0;
      e.ersatzJahre = [];
      e.ersatzBetrag = ersatz ? e.invAngesetzt * anteil : 0;
      for (let j = 1; j <= jahre; j++) {
        let wert = reihe[j - 1] + e.laufend * Math.pow(1 + g, j - 1);
        if (ersatz && j % afa === 0 && j < jahre) { wert += e.ersatzBetrag; e.ersatzJahre.push(j); }
        reihe.push(wert);
      }
      verlauf[k] = reihe;
    });

    return {
      gd: gdx, erhebung, leistungBestand, endenergieSumme, nutzwaerme, nutzwaermeGesamt, holzWeiter, holzWeiterSter, holzWeiterListe, nebenWeiter, auslegungsbedarf, heizleistung,
      mindestabnahme, hoechstbetrag, anschluss, ergebnisse, herkunft,
      guenstigste: minK, verlauf, jahre, warnungen
    };
  }

  const NAMEN = { oel: 'Öl', gas: 'Gas', holz: 'Scheitholz', kofen: 'Kaminofen', pellets: 'Pellets', hack: 'Hackgut', wp: 'Wärmepumpe' };

  /** Feste Vorgaben für jeden Vergleich. */
  const VORGABEN = { invest: { oel: 20000, gas: 20000, holz: 25000, kofen: 10000, pellets: 30000, hack: 35000, wp: 40000 },

  /** Vorbelegungen für neue Vergleiche (änderbar). */
  const VORBELEGUNG = {
    // Erfahrungswerte Einfamilienhaus (brutto €/Jahr), Marktübersichten 2026 (immowelt, kesselheld)
    nebenkosten: { oel: { wartung: 200, kk: 180 }, gas: { wartung: 160, kk: 180 }, holz: { wartung: 300, kk: 180 }, kofen: { wartung: 100, kk: 180 },

  function vorgabenAnwenden(s) {

    // Investitionen sind Vorgaben: nur setzen, wenn noch kein eigener Wert eingetragen ist
    Object.keys(VORGABEN.invest).forEach((k) => { if (s.v[k].invManuell == null) s.v[k].invManuell = VORGABEN.invest[k]; });
    // Wirkungsgrade sind fest (Wärmeliefervertrag) – eigene Werte verwerfen
    s.erhebung.forEach((z) => { if (WG_FEST[z.key] !== undefined) z.wg = WG_FEST[z.key]; });
    ['oel', 'gas', 'holz', 'kofen', 'pellets', 'hack'].forEach((k) => { s.v[k].wg = null; });
    s.v.wp.wg = 3; s.v.nw1.wg = 1; s.v.nw2.wg = null;
    s.ausblenden = VORGABEN.ausblenden.slice();
    s.nichtSieger = VORGABEN.nichtSieger.slice(); // wird angezeigt, aber nie als „Günstigste Variante“ ausgewiesen
    s.vollast = VORGABEN.vollast; // Vollaststunden fest
    s.v.nw1.sonst = 0; // keine sonstigen laufenden Kosten bei Nahwärme
    s.ersatz = true;   // langjährige Betrachtung mit Neuinvestition ohne Förderung
    s.verlaufJahre = 60; // Verlauf über 60 Jahre
    s.ersatzAnteilNW = 1;     // Nahwärme: Anschlusskosten in voller Höhe erneut
    // keine Preissteigerung, keine Leistungsstaffel für Nahwärme-Anschlusskosten
    VARIANTEN.forEach((k) => { s.v[k].steigerung = 0; });
    s.nwStaffel = false;
    s.version = 3;
    return s;
  }

  const leer = () => ({ wg: null, einheit: null, heizwert: null, preis: null, grund: null, wartung: null,
    kk: null, sonst: null, spezInv: null, invManuell: null, foerder: null, zins: null, afa: null, steigerung: null });

  function erhebungStandard() {

      { key: 'kaminH', name: 'Einzel- / Kaminofen (Holz)', kw: null, baujahr: '', brennwert: '', menge: null, hist: [], aktiv: false, einheit: 'Ster', heizwert: 1450, wg: 0.5 },
      { key: 'pellets', name: 'Pelletheizung', kw: null, baujahr: '', brennwert: '', menge: null, hist: [], aktiv: false, einheit: 'kg', heizwert: 4.8, wg: 0.85 },
      { key: 'hack', name: 'Hackgut / Sonstiges', kw: null, baujahr: '', brennwert: '', menge: null, hist: [], aktiv: false, einheit: 'm³', heizwert: 679, wg: 0.8 },
      { key: 'kamin', name: 'Einzel- / Kaminofen (Holz), Zusatzheizung', kw: null, baujahr: '', brennwert: '', menge: null, hist: [], aktiv: false, einheit: 'Ster', heizwert: 1450, wg: 0.5 }
    ];
  }

  function gdStandard() {
    return {
      oelHist: [], wartung: { netto: null, mwst: null }, kaminkehrer: [],

  function vorlageObjekt() {

    const gd = gdStandard();

    const wartung = 1230.93 + 233.88;
    const kk = ((193.48 + 36.76) + (141.96 + 26.97)) / 2;
    return {
      version: 3, nwStaffel: true, ausblenden: VORGABEN.ausblenden.slice(),

      const zve = k.zve - (k.kind ? KFW.familienzuschlag : 0);

  if (ev.target.dataset && ev.target.dataset.land !== undefined) { S.land = ev.target.value; marktpreiseAnwenden(false); aenderung(false); }

/** Gasart der Gasheizung: 'erdgas' (Standard) oder 'fluessig'. */
function gasZeile() { return S.erhebung.find((e) => e.key === 'gas'); }
function gasArt() { const z = gasZeile(); return z && z.art === 'fluessig' ? 'fluessig' : 'erdgas'; }
function erzInfo(key) {

const LPG_HEIZWERT = 6.57; // kWh je Liter Flüssiggas (Heizwert)
/** Gasart umstellen: Einheit/Heizwert der Gasheizung und Gaspreise der Vergleichsvariante anpassen. */
function gasArtSetzen(art) {
  const z = gasZeile(); if (!z || gasArt() === art) return;
  z.art = art;
  z.einheit = art === 'fluessig' ? 'Liter' : 'kWh';
  z.heizwert = art === 'fluessig' ? ((PR && PR.fluessiggas && PR.fluessiggas.heizwert) || LPG_HEIZWERT) : 1;
  z.menge = null; z.hist = []; // Verbrauch in anderer Einheit – neu eingeben

  gasPreiseSetzen();

/** Gaspreise (Preis, Grundpreis/Tankmiete, Prüfkosten) aus den Marktpreisen setzen – unabhängig von eigenen Öl-/Pelletpreisen. */

  const m = marktpreis(S.land);
  S.v.gas.preis = +m.gas.toFixed(4); S.v.gas.grund = m.gasGrund || 0; S.v.gas.sonst = m.gasSonst || 0;
}
/** Auswahl Erdgas/Flüssiggas (und Tank bei Flüssiggas). */
function gasArtHtml(kompakt) {

        : zahlFeld({ label: 'Prüfkosten Tank (anteilig)', wert: typeof z.pruefKosten === 'number' ? z.pruefKosten : tanks.eigentum.pruefJahr, dez: 2, einheit: '€/Jahr',
            set: (v) => { z.pruefKosten = v; S.v.gas.sonst = v == null ? tanks.eigentum.pruefJahr : v; }, hilfe: `vorbelegt mit ${fmt(tanks.eigentum.pruefJahr)} €/Jahr – äußere Prüfung alle 2 J., innere und Rohrleitungsprüfung alle 10 J.` })}</div>

        Gemieteter Tank: Tankmiete ca. ${fmt(tanks.miete.grundMonat, 2)} €/Monat als Grundgebühr, Prüfungen meist in der Miete enthalten.
        Eigener Tank: keine Miete, aber gesetzliche Prüfungen selbst zahlen – äußere Prüfung alle 2 Jahre, innere Prüfung (TÜV/DEKRA) und Rohrleitungsprüfung alle 10 Jahre,

        Marktpreis: <a href="${LPG_LINK}" target="_blank" rel="noopener">Flüssiggas-Tagespreise bei Brennstoffboerse.de ↗</a> (gilt für Tanks im eigenen Eigentum).</p>` : ''}`;
}

  return `<section class="seite">

    ${VGL.length ? '' : '<div class="hinweis">⚠ Keine vergleichbare Bestandsheizung angegeben (Öl, Gas, Scheitholz, Kaminofen, Pellets oder Hackgut) – es wird nur die Nahwärme berechnet.</div>'}
    ${marktpreisBox()}
    ${VGL.includes('gas') ? gasArtHtml(true) : ''}
    <div class="ergebniszeile">
      <div>Nutzwärme<b data-live="nwGesamt">${fmt(R.nutzwaerme)} kWh/a</b></div>
      <div>Heizleistung neue Anlage<b data-live="leistung">${fmt(kwAb(R.heizleistung), 1)} kW</b></div>
    </div>
    <div data-live="warnungen">${warnungenHtml()}</div>
    <h3>Je Heizsystem</h3>
    <div class="scroll"><table class="annahmen"><thead><tr><th></th>${kopf}<th></th></tr></thead><tbody>${zeilen}</tbody></table></div>
  </section>`;
}

/* ----------------------------- Nahwärme -------------------------------- */
function seiteNahwaerme() {
  const n = S.v.nw1, e = R.ergebnisse.nw1;
  return `<section class="seite">
    <h2>Nahwärme-Angebot</h2>
    <p class="lead">Preise aus dem Angebot bzw. Wärmeliefervertrag eintragen (brutto). Es gibt bewusst keine Vorgabe –
      ohne Arbeitspreis und Anschlusskosten wird die Nahwärme nicht bewertet.</p>
    <div class="felder">
      ${zahlFeld({ label: 'Arbeitspreis', wert: n.preis, faktor: 100, dez: 4, einheit: 'ct/kWh', gross: true, set: (v) => { S.v.nw1.preis = v; }, hilfe: 'Pflichtfeld' })}
      ${zahlFeld({ label: 'Grundpreis', wert: n.grund, dez: 2, einheit: '€/Monat', gross: true, set: (v) => { S.v.nw1.grund = v; }, hilfe: 'leer = kein Grundpreis' })}
      ${zahlFeld({ label: 'Anschlusskosten einmalig', wert: n.invManuell, dez: 2, einheit: '€', gross: true, set: (v) => { S.v.nw1.invManuell = v; },
        hilfe: 'Pflichtfeld (inkl. Übergabestation); nach Ablauf der Abschreibung erneut in voller Höhe ohne Förderung angesetzt' })}
    </div>
    <details>
      <summary>Finanzierung</summary>
      <div class="felder">
        ${zahlFeld({ label: 'Zinssatz', wert: n.zins, faktor: 100, dez: 2, einheit: '%', set: (v) => { S.v.nw1.zins = v; } })}
        ${zahlFeld({ label: 'Abschreibungszeit', wert: n.afa, einheit: 'Jahre', set: (v) => { S.v.nw1.afa = v; } })}
        ${zahlFeld({ label: 'Zusätzlich darstellen mit', wert: S.v.nw2.afa, einheit: 'Jahren Afa', set: (v) => { S.v.nw2.afa = v; }, hilfe: 'wird in Tabellen und Grafiken gezeigt, nicht als Ergebnis' })}
      </div>
    </details>
    <div class="ergebniszeile">
      <div>Wärmebedarf<b data-live="nwGesamt">${fmt(R.nutzwaerme)} kWh/a</b></div>
      <div>Anschlussleistung<b data-live="leistung">${fmt(kwAb(R.heizleistung), 1)} kW</b></div>
      <div>Nahwärmekosten pro Jahr<b data-live="nwKosten">${nwLive(e, 'gesamt')}</b></div>
      <div>Wärmepreis effektiv<b data-live="nwCt">${nwLive(e, 'ct')}</b></div>
    </div>
    <div data-live="warnungen">${warnungenHtml()}</div>
  </section>`;
}
function nwLive(e, was) {
  if (e.fehlt.length || !(R.nutzwaerme > 0)) return '–';
  return was === 'ct' ? fmt(e.ctEffektiv, 2) + ' ct/kWh' : euro(e.gesamt);
}

function warnungenHtml() {
  const w = R.warnungen.slice();
  if (!(R.nutzwaerme > 0)) w.push('Noch kein Verbrauch eingegeben – bitte bei den Heizungen den Jahresverbrauch eintragen.');
  return w.map((t) => `<div class="hinweis">⚠ ${esc(t)}</div>`).join('');
}

/* ----------------------------- Ergebnis -------------------------------- */
function seiteErgebnis() {
  const K = sichtbar();
  const E = R.ergebnisse;
  if (!S.hinweisOk) return seiteBestaetigung();
  if (!(R.nutzwaerme > 0) || !R.guenstigste) {
    return `<section class="seite"><h2>Ergebnis</h2>${warnungenHtml()}</section>`;
  }
  const best = E[R.guenstigste];
  const nw = E.nw1;
  const oelNW = E.oel.gesamt - nw.gesamt;
  const VK = K.filter((k) => R.verlauf[k]);
  const zeile = (l, f, d = 0, einh = '€/a', cls = '') =>
    `<tr class="${cls}"><td>${l}</td>${K.map((k) => `<td>${fmt(f(E[k]), d)}</td>`).join('')}<td class="info">${einh}</td></tr>`;
  const tabelle = `<div class="scroll"><table>
    <thead><tr><th></th>${K.map((k) => `<th>${esc(E[k].name)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${zeile('Investition', (e) => e.invAngesetzt, 0, '€')}
    ${zeile('Förderung', (e) => (e.foerderung ? -e.foerderung : 0), 0, '€')}
    ${zeile('Investition nach Förderung', (e) => e.invNetto, 0, '€')}
    ${zeile('Kapitalkosten (Annuität)', (e) => e.kapital)}
    ${zeile('Energiekosten', (e) => e.energie)}
    ${zeile('Grund-/Zählergebühr', (e) => e.grund)}
    ${zeile('Wartung, Kaminkehrer, Sonstiges', (e) => e.nebenkosten)}
    ${zeile('Laufende Kosten', (e) => e.laufend)}
    ${zeile('Gesamtkosten pro Jahr', (e) => e.gesamt, 0, '€/a', 'summe')}
    ${zeile('Wärmepreis laufend', (e) => e.ctLaufend, 2, 'ct/kWh')}
    ${zeile('+ Abschreibung', (e) => e.ctKapital, 2, 'ct/kWh')}
    ${zeile('Wärmepreis effektiv', (e) => e.ctEffektiv, 2, 'ct/kWh', 'summe')}
    <tr><td>Rang</td>${K.map((k) => `<td>${E[k].rang ?? '–'}</td>`).join('')}<td></td></tr>
    ${nw.fehlt.length ? '' : zeile('Mehr-/Minderkosten ggü. ' + esc(nw.name), (e) => e.deltaNW)}
    </tbody></table></div>
    <p class="info">${nw.fehlt.length ? 'Nahwärme ohne Angebotspreise – nicht bewertet.' : 'Mehr-/Minderkosten: positiv = teurer als Nahwärme.'}</p>
`;

  return `<section class="seite">
    <h2>Ergebnis${S.titel ? ' – ' + esc(S.titel) : ''}</h2>
    ${warnungenHtml()}
    ${fibreflexBox()}
    <div class="sieger">
      <div><div class="info">Günstigste Variante</div><div class="gross">${esc(best.name)}</div></div>
      <div><div class="info">Wärmepreis effektiv</div><div class="gross" style="color:var(--text)">${fmt(best.ctEffektiv, 2)} ct/kWh</div></div>
      ${S.erhebung[0].aktiv && isFinite(oelNW) ? `<div><div class="info">Ersparnis Nahwärme ggü. Öl</div><div class="gross" style="color:var(--text)">${euro(oelNW)}/a</div></div>` : ''}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">${R.holzWeiter > 0 ? 'Wärmebedarf ohne weiter genutztes Holz' : 'Nutzwärmebedarf'}</div><div class="w">${fmt(R.nutzwaerme)} kWh/a</div></div>
      <div class="kpi"><div class="l">Heizleistung neue Anlage</div><div class="w">${fmt(kwAb(R.heizleistung), 1)} kW</div></div>
      <div class="kpi"><div class="l">Anschlusskosten Nahwärme</div><div class="w">${isFinite(nw.invAngesetzt) ? euro(nw.invAngesetzt) : '–'}</div></div>
      <div class="kpi"><div class="l">KfW-Fördersatz (WP, Pellets, Nahwärme)</div><div class="w">${pct(kfwErgebnis().satz)}</div></div>
    </div>
    ${holzWeiterHtml()}
    <h3>Wärmepreis je kWh Nutzwärme (inkl. Abschreibung)</h3>
    <div class="legende"><span style="--c:var(--bar1)">laufende Kosten</span><span style="--c:var(--bar2)">Abschreibung (Kapitalkosten)</span></div>
    <div class="chart" id="balken"></div>
    <h3>Jahreskosten im Vergleich</h3>
    ${tabelle}
    <h3>Kumulierte Kosten über ${R.jahre} Jahre</h3>
    <p class="info" style="margin-top:-6px">Jahr 0 = Investition nach Förderung, danach laufende Kosten. Nach Ablauf der Abschreibungszeit wird ohne Förderung in voller Höhe neu investiert
      (Heizungen und Nahwärme-Anschluss)${ersatzText()}. Ohne Preissteigerung, Zinsen und Restwerte.</p>
    <div class="legende linie">${VK.map((k) => `<span style="--c:${FARBE[k]}">${esc(E[k].name)}</span>`).join('')}</div>
    <div class="chart" id="verlauf"></div>
    <details><summary>Verlauf als Tabelle</summary><div class="scroll">${verlaufTabelle()}</div></details>
    <p class="info" style="margin-top:18px">Hinweis: Vereinfachte Vergleichsrechnung. Nahwärme-Anschlusskosten ohne Umfeldmaßnahmen
      (Anschluss Puffer ans Haus, Oberflächen, hydraulischer Abgleich, Energieberater). Öl- und Gaspreise der Präsentation gelten für Kleinmengen;
      bei größeren Mengen sind Mengenpreise realistisch. Förderung: ${esc(kfwErgebnis().text)}.</p>
    <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn" data-akt="kopieren">Ergebnis kopieren (für Excel)</button>
      <button class="btn" data-akt="speichern">Speichern unter …</button>
    </div>
  </section>`;
}

/** Hinweis, wenn Scheitholz/Kaminofen weiter genutzt werden. */
function holzWeiterHtml() {
  if (!(R.holzWeiter > 0)) return '';
  const wer = R.holzWeiterListe.map((h) => (h.key === 'kamin' ? 'Kaminofen' : 'Scheitholzheizung') + ' ' + fmt(h.ster, 1) + ' Ster').join(', ');
  return `<div class="nwhinweis"><b>Holz bleibt mit im Spiel.</b> Weiterhin verheizt: ${esc(wer)} pro Jahr – das sind rund ${fmt(R.holzWeiter)} kWh Wärme.
    Die Varianten unten decken den übrigen Bedarf von ${fmt(R.nutzwaerme)} kWh/a. Das weiter genutzte Holz (ca. ${euro(R.holzWeiterSter * HOLZPREIS.preis)} im Jahr)
    fällt in allen Varianten gleich an und ist im Vergleich nicht enthalten. ${R.nebenWeiter > 0 ? 'Die Zusatzheizung (Kaminofen) bleibt außen vor: keine Neuinvestition, ihr Wärmeanteil wird nicht über die Nahwärme ersetzt. Die Nahwärme wird für ' + fmt(R.auslegungsbedarf) + ' kWh/a ausgelegt.' : 'Die Nahwärme wird für den vollen Bedarf von ' + fmt(R.nutzwaermeGesamt) + ' kWh/a ausgelegt.'}</div>`;
}

/** Sperrseite: Förder-Hinweis muss bestätigt werden, bevor die Übersicht erscheint. */
function seiteBestaetigung() {
  return `<section class="seite">
    <h2>Ergebnis${S.titel ? ' – ' + esc(S.titel) : ''}</h2>
    <p class="lead">Bitte vor der Übersicht den folgenden Hinweis lesen und bestätigen.</p>
    ${warnungenHtml()}
    ${beraterHinweis(true)}
    <p class="info">Angesetzt ist: ${esc(kfwErgebnis().text)}.</p>
    <label class="bestaetigen"><input type="checkbox" id="hinweisCheck">
      Ich habe verstanden, dass die Förderung unverbindlich ist und durch einen Energieberater geklärt werden muss.</label>
    <button class="btn primaer" id="hinweisWeiter" disabled>Übersicht anzeigen</button>
  </section>`;
}

function ersatzText() {
  const t = sichtbar().filter((k) => (R.ergebnisse[k].ersatzJahre || []).length)
    .map((k) => `${R.ergebnisse[k].name} in Jahr ${R.ergebnisse[k].ersatzJahre.join(' und ')} (${euro(R.ergebnisse[k].ersatzBetrag)})`);
  return t.length ? ' – ' + esc(t.join(', ')) : '';
}

function verlaufTabelle() {
  const K = WV.VARIANTEN.filter((k) => R.verlauf[k]);
  let h = `<table><thead><tr><th>Jahr</th>${K.map((k) => `<th>${esc(R.ergebnisse[k].name)}</th>`).join('')}</tr></thead><tbody>`;
  for (let j = 0; j <= R.jahre; j++) h += `<tr><td>${j}</td>${K.map((k) => `<td>${fmt(R.verlauf[k][j])}</td>`).join('')}</tr>`;
  return h + '</tbody></table>';
}

/** Gestapeltes Balkendiagramm (horizontal), sortiert nach effektivem Wärmepreis. */
function zeichneBalken() {
  const el = $('#balken'); if (!el) return;
  const K = sichtbar().filter((k) => isFinite(R.ergebnisse[k].ctEffektiv)).sort((a, b) => R.ergebnisse[a].ctEffektiv - R.ergebnisse[b].ctEffektiv);
  const W = Math.max(320, el.clientWidth), zeileH = 34, links = 170, rechts = 70, oben = 8;
  const H = oben + K.length * zeileH + 24;
  const max = Math.max(...K.map((k) => R.ergebnisse[k].ctEffektiv)) * 1.05 || 1;
  const x = (v) => links + (W - links - rechts) * v / max;
  const schritt = max > 20 ? 5 : max > 8 ? 2 : 1;
  let g = '';
  for (let t = 0; t <= max; t += schritt) {
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${oben}" y2="${H - 22}" stroke="var(--line)" stroke-width="1"/>
          <text x="${x(t)}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="middle">${t}</text>`;
  }
  K.forEach((k, i) => {
    const e = R.ergebnisse[k], y = oben + i * zeileH + 6, h = zeileH - 12;
    const w1 = x(e.ctLaufend) - x(0), w2 = x(e.ctEffektiv) - x(e.ctLaufend);
    const fett = k === R.guenstigste ? ' font-weight="700"' : '';
    g += `<g data-tip="${k}">
      <rect x="0" y="${y - 6}" width="${W}" height="${zeileH}" fill="transparent"/>
      <text x="${links - 10}" y="${y + h / 2 + 4}" font-size="13" fill="var(--text)" text-anchor="end"${fett}>${esc(e.name)}</text>
      <rect x="${x(0)}" y="${y}" width="${Math.max(0, w1 - 1)}" height="${h}" rx="4" fill="var(--bar1)"/>
      <rect x="${x(e.ctLaufend) + 1}" y="${y}" width="${Math.max(0, w2 - 1)}" height="${h}" rx="4" fill="var(--bar2)"/>
      <text x="${x(e.ctEffektiv) + 6}" y="${y + h / 2 + 4}" font-size="12" fill="var(--text)"${fett}>${fmt(e.ctEffektiv, 2)}</text></g>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Wärmepreis je Variante in ct/kWh">${g}
    <text x="${W - rechts + 6}" y="${H - 6}" font-size="11" fill="var(--text-3)">ct/kWh</text></svg><div class="tooltip"></div>`;
  const tip = $('.tooltip', el);
  el.querySelectorAll('g[data-tip]').forEach((gr) => {
    gr.addEventListener('mousemove', (ev) => {
      const e = R.ergebnisse[gr.dataset.tip];
      tip.innerHTML = `<b>${esc(e.name)}</b> · Rang ${e.rang}
        <div class="z"><span><i style="background:var(--bar1)"></i>laufend</span><span>${fmt(e.ctLaufend, 2)} ct</span></div>
        <div class="z"><span><i style="background:var(--bar2)"></i>Abschreibung</span><span>${fmt(e.ctKapital, 2)} ct</span></div>
        <div class="z"><b>effektiv</b><b>${fmt(e.ctEffektiv, 2)} ct/kWh</b></div>
        <div class="z"><span>Gesamt</span><span>${euro(e.gesamt)}/a</span></div>`;
      tipZeigen(el, tip, ev);
    });
    gr.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

function tipZeigen(el, tip, ev) {
  const r = el.getBoundingClientRect();
  tip.style.display = 'block';
  let lx = ev.clientX - r.left + 14, ty = ev.clientY - r.top + 14;
  if (lx + tip.offsetWidth > r.width) lx = ev.clientX - r.left - tip.offsetWidth - 14;
  tip.style.left = Math.max(0, lx) + 'px'; tip.style.top = ty + 'px';
}

/** Liniendiagramm der kumulierten Kosten mit Fadenkreuz-Tooltip. */
function zeichneVerlauf() {
  const el = $('#verlauf'); if (!el) return;
  const K = WV.VARIANTEN.filter((k) => R.verlauf[k]);
  const W = Math.max(320, el.clientWidth), H = 300, l = 64, r = 16, o = 10, u = 28;
  const alle = K.flatMap((k) => R.verlauf[k]).filter(isFinite);
  const min = Math.min(0, ...alle), maxRoh = Math.max(...alle);
  const st = schoeneSchritte(min, maxRoh);
  const x = (j) => l + (W - l - r) * j / R.jahre;
  const y = (v) => o + (H - o - u) * (1 - (v - st.min) / (st.max - st.min));
  let g = '';
  for (let v = st.min; v <= st.max + 1e-9; v += st.schritt) {
    g += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
      <text x="${l - 8}" y="${y(v) + 4}" font-size="11" fill="var(--text-3)" text-anchor="end">${kurzEuro(v)}</text>`;
  }
  for (let j = 0; j <= R.jahre; j += R.jahre > 20 ? 5 : 2) {
    g += `<text x="${x(j)}" y="${H - 8}" font-size="11" fill="var(--text-3)" text-anchor="middle">${j}</text>`;
  }
  K.forEach((k) => {
    const pts = R.verlauf[k].map((v, j) => `${x(j).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const nw = k === 'nw1' || k === 'nw2';
    g += `<polyline points="${pts}" fill="none" stroke="${FARBE[k]}" stroke-width="${nw ? 3.5 : 2}" stroke-linejoin="round"${k === 'nw2' ? ' stroke-dasharray="7 5"' : ''}/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Kumulierte Kosten über die Jahre">${g}
    <line class="kreuz" y1="${o}" y2="${H - u}" stroke="var(--text-3)" stroke-dasharray="3 3" style="display:none"/>
    <rect x="${l}" y="${o}" width="${W - l - r}" height="${H - o - u}" fill="transparent" class="flaeche"/></svg>
    <div class="info" style="text-align:right">Jahre</div><div class="tooltip"></div>`;
  const tip = $('.tooltip', el), kreuz = $('.kreuz', el), fl = $('.flaeche', el);
  fl.addEventListener('mousemove', (ev) => {
    const rr = el.querySelector('svg').getBoundingClientRect();
    const j = Math.max(0, Math.min(R.jahre, Math.round((ev.clientX - rr.left - l) / (W - l - r) * R.jahre)));
    kreuz.setAttribute('x1', x(j)); kreuz.setAttribute('x2', x(j)); kreuz.style.display = '';
    const sortiert = K.slice().sort((a, b) => R.verlauf[a][j] - R.verlauf[b][j]);
    tip.innerHTML = `<b>Jahr ${j}</b>` + sortiert.map((k) =>
      `<div class="z"><span><i style="background:${FARBE[k]}"></i>${esc(R.ergebnisse[k].name)}</span><span>${euro(R.verlauf[k][j])}</span></div>`).join('');
    tipZeigen(el, tip, ev);
  });
  fl.addEventListener('mouseleave', () => { tip.style.display = 'none'; kreuz.style.display = 'none'; });
}
function schoeneSchritte(min, max) {
  const spanne = (max - min) || 1;
  const roh = spanne / 5, p = Math.pow(10, Math.floor(Math.log10(roh)));
  const schritt = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= roh);
  return { min: Math.floor(min / schritt) * schritt, max: Math.ceil(max / schritt) * schritt, schritt };
}
function kurzEuro(v) {
  if (Math.abs(v) >= 1e6) return fmt(v / 1e6, 1) + ' Mio €';
  if (Math.abs(v) >= 1e3) return fmt(v / 1e3, 0) + ' T€';
  return fmt(v, 0) + ' €';
}

/* ----------------------------- Rendering ------------------------------- */
function render() {
  const liste = schrittListe();
  if (schritt >= liste.length) schritt = liste.length - 1;
  for (const k in FELD_HANDLER) delete FELD_HANDLER[k];
  const akt = liste[schritt];
  $('#schritte').innerHTML = liste.map((s, i) => `<button data-schritt="${i}" class="${i === schritt ? 'aktiv' : i < schritt ? 'fertig' : ''}"
     title="${esc(s.name)} (Alt+${i + 1})"><span class="nr">${i < schritt ? '✓' : i + 1}</span>${esc(s.name)}</button>`).join('');
  let html;
  if (akt.id === 'start') html = seiteStart();
  else if (akt.id.startsWith('erz:')) html = seiteErzeuger(akt.id.slice(4));
  else if (akt.id === 'nahwaerme') html = seiteNahwaerme();
  else if (akt.id === 'annahmen') html = seiteAnnahmen();
  else if (akt.id === 'foerderung') html = seiteFoerderung();
  else html = seiteErgebnis();
  $('#seite').innerHTML = html;
  $('#kopfObjekt').textContent = S.titel ? '– ' + S.titel : '';
  $('#zurueck').disabled = schritt === 0;
  const letzte = schritt === liste.length - 1;
  $('#weiter').style.visibility = letzte ? 'hidden' : 'visible';
  $('#weiter').innerHTML = schritt === liste.length - 2 ? 'Zum Ergebnis (<u class="mn">W</u>)' : '<u class="mn">W</u>eiter';
  zeichneBalken(); zeichneVerlauf();
}

/** Nur abhängige Anzeigen aktualisieren, damit der Fokus im Eingabefeld bleibt. */
function liveAktualisieren() {
  const akt = schrittListe()[schritt];
  const setz = (n, t) => document.querySelectorAll(`[data-live="${n}"]`).forEach((el) => { el.innerHTML = t; });
  setz('nwGesamt', fmt(R.nutzwaerme) + ' kWh/a');
  setz('nwVoll', fmt(R.nutzwaermeGesamt) + ' kWh/a');
  setz('leistung', fmt(kwAb(R.heizleistung), 1) + ' kW');
  setz('hoechst', S.we > 0 ? euro(R.hoechstbetrag) : '–');
  setz('warnungen', warnungenHtml());
  setz('landHinweis', landHinweis());
  setz('kfwSumme', kfwSummeHtml());
  setz('kgbStatus', kgbStatusHtml());
  setz('verbrauchCheck', verbrauchCheckHtml());
  document.querySelectorAll('[data-kfwtausch]').forEach((cb) => { cb.checked = !!(S.kfw && S.kfw.tausch); });
  setz('kfwSatz', pct(kfwErgebnis().satz));

  setz('nwKosten', nwLive(R.ergebnisse.nw1, 'gesamt'));
  setz('nwCt', nwLive(R.ergebnisse.nw1, 'ct'));
  if (akt && akt.id.startsWith('erz:')) {
    const ez = R.erhebung.find((e) => e.key === akt.id.slice(4));
    setz('endenergie', fmt(ez.endenergie) + ' kWh/a');
    setz('nutzwaerme', fmt(ez.nutzwaerme) + ' kWh/a');

    platzhalterAnnahmen(); // übernommene Werte (Platzhalter) nachziehen
  }
}
function platzhalterAnnahmen() {
  const inputs = [...document.querySelectorAll('table.annahmen tbody input')];
  let i = 0;
  ANNAHMEN.forEach((a) => VGL.forEach((k) => {
    if (a.fest || (a.f === 'spezInv' && WV.VORGABEN.invest[k] !== undefined)) return;
    const inp = inputs[i++]; if (!inp) return;
    const fk = a.faktor ? a.faktor(k) : 1;
    const eff = R.ergebnisse[k].eingabe[a.f];
    inp.placeholder = a.ph ? a.ph(k) : (eff == null ? '' : fmtFlex(+(eff * fk).toFixed(a.f === 'preis' ? 4 : 2)));
  }));
}

function geheZu(i) {
  const n = schrittListe().length;
  const ziel = Math.max(0, Math.min(n - 1, i));
  // Vor der Nahwärme: niedrigen Verbrauch prüfen lassen
  const nwIdx = schrittListe().findIndex((s) => s.id === 'nahwaerme');
  if (schritt < nwIdx && ziel >= nwIdx && verbrauchPruefen()) return;
  schritt = ziel;
  render();
  window.scrollTo(0, 0);
  const erstes = $('#seite input:not([type=checkbox])') || $('#seite input');
  if (erstes && schrittListe()[schritt].id !== 'ergebnis') erstes.focus({ preventScroll: true });
}

/* ----------------------------- Plausibilität Verbrauch ----------------- */
const VERBRAUCH_GRENZE = 6000; // kWh/a Endenergie aller bisherigen Heizungen
/** Typischer Endenergieverbrauch (Heizung + Warmwasser) je m² Wohnfläche nach Baujahr (nicht angezeigt).
 *  Quelle: reduco-Modellrechnung, kalibriert an Heizspiegel 2025. */
const VERBRAUCH_BAUJAHR = [[1977, 200, 300], [1994, 150, 200], [2001, 120, 160], [2015, 80, 120], [9999, 50, 80]];
function verbrauchTypisch() {
  const bj = S.gebaeudeBaujahr, m2 = S.wohnflaeche;
  if (!(typeof bj === 'number' && bj >= 1800) || !(m2 > 0)) return null;
  const z = VERBRAUCH_BAUJAHR.find(([bis]) => bj <= bis);
  return { von: z[1] * m2, bis: z[2] * m2 };
}
/** true = Hinweisfenster wurde geöffnet (Weiter unterbrochen). */
function verbrauchPruefen() {
  const summe = Math.round(R.endenergieSumme);
  if (!(summe > 0) || summe >= VERBRAUCH_GRENZE || S.verbrauchOk === summe) return false;
  dialogVerbrauch();
  return true;
}
function verbrauchCheckHtml() {
  const summe = R.endenergieSumme, t = verbrauchTypisch();
  if (!t) return `<p>Sie haben insgesamt <b>${fmt(summe)} kWh</b> pro Jahr angegeben. Bitte Baujahr und Wohnfläche eintragen – dann zeigen wir,
    welcher Verbrauch für Ihr Haus üblich ist.</p>`;
  const passt = summe >= t.von;
  return `<p>Sie haben insgesamt <b>${fmt(summe)} kWh</b> pro Jahr angegeben. Für ein Haus mit ${fmt(S.wohnflaeche)} m² und Baujahr ${S.gebaeudeBaujahr}
    sind etwa <b>${fmt(t.von)} bis ${fmt(t.bis)} kWh</b> üblich.</p>
    ${passt ? '<p class="kgb-status"><span class="kgb ja">✓</span> Ihr Verbrauch passt zu Baujahr und Wohnfläche.</p>'
            : '<p class="kgb-status"><span class="kgb offen">!</span> Ihr Verbrauch ist für dieses Haus sehr niedrig – bitte prüfen Sie Ihre Angaben.</p>'}`;
}
function dialogVerbrauch() {
  const summe = Math.round(R.endenergieSumme);
  dialog(`<h3>Bitte prüfen Sie Ihren Wärmebedarf</h3>
    <div class="felder">
      ${zahlFeld({ label: 'Baujahr des Gebäudes', wert: S.gebaeudeBaujahr ?? null, jahr: true, platzhalter: 'z. B. 1985',
        set: (v) => { S.gebaeudeBaujahr = (typeof v === 'number' && v >= 1800 && v <= new Date().getFullYear()) ? v : null;
          if (S.gebaeudeBaujahr && S.kfw && S.kfw.bauantrag == null) S.kfw.bauantrag = S.gebaeudeBaujahr; } })}
      ${zahlFeld({ label: 'Wohnfläche', wert: S.wohnflaeche ?? null, einheit: 'm²', platzhalter: 'z. B. 130', set: (v) => { S.wohnflaeche = v > 0 ? v : null; } })}
    </div>
    <div data-live="verbrauchCheck" style="margin-top:12px">${verbrauchCheckHtml()}</div>
    <div class="nwhinweis"><b>Planen Sie großzügig.</b> Die Nahwärmeleitung wird nach Ihrem Bedarf ausgelegt und bleibt für Jahrzehnte im Boden.
      Denken Sie auch an die Zeit, in der Holz schleppen mühsam wird, und an alle, die nach Ihnen im Haus wohnen.
      Ein vollwertiger Nahwärme-Anschluss macht Ihr Haus zudem beim Verkauf attraktiver.</div>
    <div class="knoepfe"><button class="btn" id="dAbbr">Verbrauch anpassen</button><button class="btn primaer" id="dOk">Angabe ist richtig – weiter</button></div>`);
  $('#dAbbr').onclick = dialogZu;
  $('#dOk').onclick = () => {
    S.verbrauchOk = summe; dialogZu();
    geheZu(schrittListe().findIndex((x) => x.id === 'nahwaerme'));
  };
}

/* ----------------------------- Klicks ---------------------------------- */
document.addEventListener('change', (ev) => {
  const k = ev.target.dataset.erz;
  if (k) { S.erhebung.find((z) => z.key === k).aktiv = ev.target.checked; aenderung(false); ev.target.closest('.kachel').classList.toggle('an', ev.target.checked); render(); const cb = $(`[data-erz="${k}"]`); if (cb) cb.focus(); }
});
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) { if (!ev.target.closest('.menue')) menue(false); return; }
  if (t.dataset.schritt) return geheZu(+t.dataset.schritt);
  if (t.id === 'weiter') return geheZu(schritt + 1);
  if (t.id === 'hinweisWeiter') { if ($('#hinweisCheck').checked) { S.hinweisOk = true; aenderung(true); } return; }
  if (t.id === 'zurueck') return geheZu(schritt - 1);
  if (t.id === 'menueKnopf') return menue(!$('#menueListe').classList.contains('offen'));
  if (t.dataset.bleibt) { const z = aktuellerErzeuger(); z.bleibt = t.dataset.bleibt === 'ja'; aenderung(true); return; }
  if (t.dataset.gasart) { gasArtSetzen(t.dataset.gasart); aenderung(true); return; }
  if (t.dataset.tank) { const z = gasZeile(); z.tank = t.dataset.tank; gasPreiseSetzen(); aenderung(true); return; }
  if (t.dataset.bw) { const z = aktuellerErzeuger(); z.brennwert = z.brennwert === t.dataset.bw ? '' : t.dataset.bw; aenderung(true); return; }
  if (t.dataset.histAdd !== undefined) {
    const z = aktuellerErzeuger(); z.hist = z.hist || [];
    const letztes = z.hist.length ? z.hist[z.hist.length - 1].jahr : new Date().getFullYear() - 1;
    z.hist.push({ jahr: (letztes || 2024) + (z.hist.length ? 1 : 0), menge: null });
    aenderung(true); const ins = document.querySelectorAll('.hist tbody input'); if (ins.length) ins[ins.length - 1].focus(); return;
  }
  if (t.dataset.kfwfrage) {
    S.kfw[t.dataset.kfwfrage] = t.dataset.wert === 'ja'; S.hinweisOk = false;
    kfwSichtbarkeit(t.closest('.kfwform')); aenderung(false); return;
  }
  if (t.dataset.markt !== undefined) {
    marktpreiseAnwenden(true); aenderung(true); toast('Marktpreise übernommen'); return;
  }
  if (t.dataset.plzkopie !== undefined) { kopieren(S.plz, 'PLZ kopiert'); return;
  }
  if (t.dataset.histDel !== undefined) { aktuellerErzeuger().hist.splice(+t.dataset.histDel, 1); aenderung(true); return; }
  if (t.dataset.akt) { menue(false); aktion(t.dataset.akt); }
});
function aktuellerErzeuger() { return S.erhebung.find((z) => z.key === schrittListe()[schritt].id.slice(4)); }
function menue(auf) {
  $('#menueListe').classList.toggle('offen', auf);
  $('#menueKnopf').setAttribute('aria-expanded', auf);
  if (auf) $('#menueListe button').focus();
}

/* ----------------------------- Aktionen -------------------------------- */
function laden(neu, meldung) { S = WV.vorgabenAnwenden(migrieren(neu)); S.hinweisOk = false; marktpreiseAnwenden(false); schritt = 0; aenderung(true); if (meldung) toast(meldung); }

function aktion(a) {
  if (a === 'neu') return frage('Neuer Vergleich', 'Alle aktuellen Eingaben werden verworfen. Gespeicherte Vergleiche bleiben erhalten.', 'Neu beginnen',
    () => laden(WV.vorlageLeer(), 'Neuer Vergleich'));
  if (a === 'beispielObjekt') { const b = WV.vorlageObjekt(); b.v.nw1.invManuell = 80000; b.v.pellets.wartung = 180; return laden(b, 'Beispiel Objekt geladen'); }
  if (a === 'beispielEFH') { const b = WV.vorlageEFH(); b.v.nw1.invManuell = 15000; b.v.pellets.wartung = 180; return laden(b, 'Beispiel Einfamilienhaus geladen'); }
  if (a === 'speichern') return dialogSpeichern();
  if (a === 'oeffnen') return dialogOeffnen();
  if (a === 'kopieren') return ergebnisKopieren();
  if (a === 'export') return dialogText('Daten exportieren', 'Diesen Text kopieren und z. B. per E-Mail weitergeben oder sichern.', JSON.stringify(S, null, 1), true);
  if (a === 'import') return dialogText('Daten importieren', 'Exportierten Text hier einfügen oder eine .json-Datei wählen.', '', false);
  if (a === 'hilfe') return dialogHilfe();
  if (a === 'kfw') return dialogKfw();
  if (a === 'qr') return dialogQr();
  if (a === 'letzter') {
    const l = speicherLesen(SPEICHER_AKTUELL, null);
    if (!l || !l.erhebung || !l.v) { toast('Kein zuletzt bearbeiteter Vergleich in diesem Browser'); return; }
    return laden(l, 'Letzter Stand wiederhergestellt' + (l.titel ? ': ' + l.titel : ''));
  }
}

function dialogZu() { $('#dialog').classList.remove('offen'); }

  dialog(`<h3>Speichern unter</h3><p class="info">Wird in diesem Browser gespeichert.</p>

function dialogOeffnen() {
  const liste = speicherLesen(SPEICHER_LISTE, {});

  dialog(`<h3>Öffnen</h3>${namen.length ? `<table><tbody>${namen.map((n) => `<tr><td>${esc(n)}<br><span class="info">${new Date(liste[n].datum).toLocaleString('de-DE')}</span></td>

}

function dialogText(titel, text, inhalt, nurLesen) {
  dialog(`<h3>${esc(titel)}</h3><p class="info">${esc(text)}</p><textarea id="dText" ${nurLesen ? 'readonly' : ''}>${esc(inhalt)}</textarea>
    ${nurLesen ? '' : '<input type="file" id="dDatei" accept=".json,.txt" style="margin-top:8px">'}
    <div class="knoepfe"><button class="btn" id="dAbbr">Schließen</button><button class="btn primaer" id="dOk">${nurLesen ? 'In Zwischenablage kopieren' : 'Importieren'}</button></div>`);
  $('#dAbbr').onclick = dialogZu;
  if (nurLesen) { $('#dText').select(); $('#dOk').onclick = () => kopieren($('#dText').value, 'Daten kopiert'); return; }
  $('#dDatei').onchange = (e) => { const f = e.target.files[0]; if (f) f.text().then((t) => { $('#dText').value = t; }); };

    } catch (e) { toast('Text ist kein gültiger Export'); }
  };
}

function kopieren(text, meldung) {
  const ok = () => toast(meldung);
  try {
    navigator.clipboard.writeText(text).then(ok, () => fallbackKopie(text) ? ok() : toast('Kopieren nicht erlaubt'));
  } catch (e) { fallbackKopie(text) ? ok() : toast('Kopieren nicht erlaubt'); }
}
function fallbackKopie(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); return ok;
}
function ergebnisKopieren() {
  if (!S.hinweisOk) { geheZu(schrittListe().length - 1); toast('Bitte zuerst den Förder-Hinweis bestätigen'); return; }
  const K = sichtbar(), E = R.ergebnisse;
  const z = (l, f, d = 2) => [l, ...K.map((k) => { const v = f(E[k]); return (typeof v === 'number' && isFinite(v)) ? v.toFixed(d).replace('.', ',') : ''; })].join('\t');
  const zeilen = [
    'Wirtschaftlichkeitsvergleich' + (S.titel ? ' – ' + S.titel : ''),
    'Nutzwärme (kWh/a)\t' + R.nutzwaerme.toFixed(0), 'Heizleistung neu (kW)\t' + fmt(kwAb(R.heizleistung), 1), '',
    ['', ...K.map((k) => E[k].name)].join('\t'),
    z('Investition (€)', (e) => e.invAngesetzt, 0), z('Förderung (€)', (e) => e.foerderung, 0), z('Investition nach Förderung (€)', (e) => e.invNetto, 0),
    z('Kapitalkosten (€/a)', (e) => e.kapital, 0), z('Energiekosten (€/a)', (e) => e.energie, 0), z('Grundgebühr (€/a)', (e) => e.grund, 0),
    z('Wartung, Kaminkehrer, Sonstiges (€/a)', (e) => e.nebenkosten, 0), z('Laufende Kosten (€/a)', (e) => e.laufend, 0),
    z('Gesamtkosten (€/a)', (e) => e.gesamt, 0), z('Wärmepreis laufend (ct/kWh)', (e) => e.ctLaufend), z('Abschreibung (ct/kWh)', (e) => e.ctKapital),
    z('Wärmepreis effektiv (ct/kWh)', (e) => e.ctEffektiv), z('Rang', (e) => e.rang, 0), z('Mehr-/Minderkosten ggü. Nahwärme (€/a)', (e) => e.deltaNW, 0),
    '', 'Günstigste Variante\t' + (R.guenstigste ? E[R.guenstigste].name : '–')
  ];
  kopieren(zeilen.join('\n'), 'Ergebnis kopiert – in Excel mit Strg+V einfügen');
}

/* ----------------------------- Tastatur -------------------------------- */
document.addEventListener('keydown', (ev) => {
  const dialogOffen = $('#dialog').classList.contains('offen');
  if (ev.key === 'Escape') { if (dialogOffen) dialogZu(); menue(false); return; }
  if (ev.key === 'F1') { ev.preventDefault(); aktion('hilfe'); return; }
  const strg = ev.ctrlKey || ev.metaKey;
  if (strg && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 's') { ev.preventDefault(); aktion('speichern'); return; }
  if (strg && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'o') { ev.preventDefault(); aktion('oeffnen'); return; }
  if (strg && ev.altKey && ev.key.toLowerCase() === 'n') { ev.preventDefault(); aktion('neu'); return; }
  if (strg && ev.shiftKey && ev.key.toLowerCase() === 'c') { ev.preventDefault(); aktion('kopieren'); return; }
  if (dialogOffen) return;
  if (ev.altKey && !strg) {
    const k = ev.key.toLowerCase();
    if (k === 'w') { ev.preventDefault(); geheZu(schritt + 1); return; }
    if (k === 'z') { ev.preventDefault(); geheZu(schritt - 1); return; }
    if (k === 'd') { ev.preventDefault(); menue(true); return; }
    if (k === 'k') { ev.preventDefault(); aktion('kfw'); return; }
    if (k === 'q') { ev.preventDefault(); aktion('qr'); return; }
    if (/^[1-9]$/.test(ev.key)) { ev.preventDefault(); geheZu(+ev.key - 1); return; }
  }
  if ($('#menueListe').classList.contains('offen') && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    ev.preventDefault();
    const b = [...document.querySelectorAll('#menueListe button')]; const i = b.indexOf(document.activeElement);
    b[(i + (ev.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus(); return;
  }
  // Enter in einem Eingabefeld = weiter (wie ein Assistent unter Windows)
  if (ev.key === 'Enter' && !strg && !ev.shiftKey) {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'button' || tag === 'a') return;
    if ($('#menueListe').classList.contains('offen')) return;
    ev.preventDefault(); geheZu(schritt + 1);
  }
});
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { zeichneBalken(); zeichneVerlauf(); }, 120); });

let startLeer = true; // erst nach der ersten Eingabe/Aktion wird der aktuelle Stand im Browser gesichert
